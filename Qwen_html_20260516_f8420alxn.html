<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ GlamChat - Socialite Messenger</title>
    <style>
        /* === CSS LENGKAP DARI VERSI SEBELUMNYA + PRODUCTION ENHANCEMENTS === */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--pink:#ff6b9d;--pink-light:#ff9ec6;--pink-dark:#e84580;--gold:#d4a574;--gold-light:#f0d5a8;--rose-gold:#b76e79;--cream:#fff5f5;--lavender:#f3e8ff;--white:#fff;--dark:#2d1f3d;--gray:#9a8faa;--light-gray:#f0eaf5}
        body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#fce4ec 0%,#f3e5f5 30%,#fff3e0 60%,#fce4ec 100%);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;animation:gradientShift 15s ease infinite;background-size:400% 400%}
        @keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
        .app-container{width:100%;max-width:480px;height:95vh;max-height:850px;background:var(--white);border-radius:30px;box-shadow:0 20px 60px rgba(255,107,157,.2),0 0 0 1px rgba(212,165,116,.1);overflow:hidden;display:flex;flex-direction:column;position:relative}
        .screen{display:none;height:100%}.screen.active{display:flex;flex-direction:column}
        
        /* AUTH SCREEN */
        #authScreen{justify-content:center;align-items:center;background:linear-gradient(135deg,var(--pink) 0%,var(--rose-gold) 50%,var(--gold) 100%)}
        .auth-container{background:var(--white);border-radius:24px;padding:30px;width:90%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.15);animation:slideUp .4s ease}
        @keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
        .auth-header{text-align:center;margin-bottom:25px}
        .auth-header .app-logo{font-family:'Playfair Display',serif;font-size:32px;color:var(--pink-dark);margin-bottom:8px}
        .auth-tagline{color:var(--gray);font-size:14px}
        .auth-input{width:100%;padding:14px 18px;border:2px solid var(--light-gray);border-radius:14px;font-family:'Poppins',sans-serif;font-size:14px;margin-bottom:12px;transition:.3s;outline:none}
        .auth-input:focus{border-color:var(--pink-light);box-shadow:0 0 0 3px rgba(255,107,157,.1)}
        .btn-primary{width:100%;padding:14px;background:linear-gradient(135deg,var(--pink),var(--pink-dark));color:white;border:none;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;transition:.3s;margin-top:8px}
        .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(255,107,157,.4)}
        .btn-google{width:100%;padding:12px;background:white;border:2px solid var(--light-gray);border-radius:14px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:.3s;margin-top:10px}
        .btn-google:hover{background:var(--light-gray)}
        .btn-google img{width:20px;height:20px}
        .auth-divider{display:flex;align-items:center;margin:20px 0;color:var(--gray);font-size:13px}
        .auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--light-gray)}
        .auth-divider span{padding:0 15px}
        .auth-switch{text-align:center;margin-top:15px;font-size:13px;color:var(--gray)}
        .auth-switch a{color:var(--pink-dark);text-decoration:none;font-weight:500}
        .auth-switch a:hover{text-decoration:underline}
        
        /* HEADER */
        .header{background:linear-gradient(135deg,var(--pink) 0%,var(--rose-gold) 50%,var(--gold) 100%);padding:20px 25px 15px;position:relative;overflow:hidden}
        .header::after{content:'✨';position:absolute;top:10px;right:20px;font-size:24px;animation:sparkle 2s ease-in-out infinite}
        @keyframes sparkle{0%,100%{opacity:1;transform:scale(1)rotate(0)}50%{opacity:.5;transform:scale(1.2)rotate(15deg)}}
        .header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
        .header-icons{display:flex;gap:15px}
        .header-icon{width:38px;height:38px;background:rgba(255,255,255,.2);border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.3s;font-size:16px}
        .header-icon:hover{background:rgba(255,255,255,.35);transform:scale(1.1)}
        
        /* STORIES */
        .stories-container{display:flex;gap:12px;overflow-x:auto;padding-bottom:5px;scrollbar-width:none}
        .stories-container::-webkit-scrollbar{display:none}
        .story{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;flex-shrink:0}
        .story-ring{width:56px;height:56px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#ff6b9d,#f0d5a8,#b76e79);transition:.3s}
        .story:hover .story-ring{transform:scale(1.1)}
        .story-ring.seen{background:#ddd}
        .story-avatar{width:100%;height:100%;border-radius:50%;border:3px solid white;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--cream)}
        .story-name{font-size:10px;color:white;font-weight:500;max-width:60px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        
        /* TABS & SEARCH */
        .tabs{display:flex;background:var(--light-gray);padding:4px}
        .tab{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:600;color:var(--gray);cursor:pointer;border-radius:12px;transition:.3s}
        .tab.active{background:var(--white);color:var(--pink-dark);box-shadow:0 2px 8px rgba(255,107,157,.15)}
        .search-bar{padding:15px 20px 10px}
        .search-input-wrapper{display:flex;align-items:center;background:var(--light-gray);border-radius:16px;padding:10px 16px;gap:10px}
        .search-input{border:none;background:transparent;outline:none;font-family:'Poppins',sans-serif;font-size:14px;color:var(--dark);width:100%}
        
        /* CHAT LIST */
        .chat-list{flex:1;overflow-y:auto;padding:5px 0}
        .chat-item{display:flex;align-items:center;padding:12px 20px;gap:14px;cursor:pointer;transition:.3s;position:relative}
        .chat-item:hover{background:var(--cream)}
        .chat-item.active{background:linear-gradient(90deg,rgba(255,107,157,.08),transparent)}
        .chat-avatar{width:52px;height:52px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;position:relative}
        .online-dot{position:absolute;bottom:1px;right:1px;width:14px;height:14px;background:#4ade80;border-radius:50%;border:3px solid white}
        .chat-info{flex:1;min-width:0}
        .chat-name{font-weight:600;font-size:15px;color:var(--dark);display:flex;align-items:center;gap:6px}
        .chat-preview{font-size:13px;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
        .chat-meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
        .chat-time{font-size:11px;color:var(--gray)}
        .unread-badge{background:linear-gradient(135deg,var(--pink),var(--pink-dark));color:white;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 6px}
        
        /* CHAT VIEW */
        .chat-view{display:none;flex-direction:column;height:100%;position:absolute;top:0;left:0;width:100%;background:var(--white);z-index:100}
        .chat-view.active{display:flex}
        .chat-view-header{background:linear-gradient(135deg,var(--pink) 0%,var(--rose-gold) 50%,var(--gold) 100%);padding:15px 20px;display:flex;align-items:center;gap:14px}
        .back-btn{width:36px;height:36px;background:rgba(255,255,255,.2);border:none;border-radius:12px;color:white;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
        .chat-view-avatar{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(255,255,255,.2)}
        .chat-view-info{flex:1}
        .chat-view-name{color:white;font-weight:600;font-size:16px}
        .chat-view-status{color:rgba(255,255,255,.85);font-size:12px}
        .chat-view-actions{display:flex;gap:10px}
        .action-btn{width:36px;height:36px;background:rgba(255,255,255,.2);border:none;border-radius:12px;color:white;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
        
        /* MESSAGES */
        .messages-container{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(180deg,#fef9f0 0%,#fff5f8 50%,#f9f0ff 100%)}
        .message{display:flex;flex-direction:column;max-width:80%;animation:messageSlide .4s ease-out}
        @keyframes messageSlide{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        .message.sent{align-self:flex-end}.message.received{align-self:flex-start}
        .message-bubble{padding:12px 16px;border-radius:20px;font-size:14px;line-height:1.5;position:relative;word-wrap:break-word}
        .message.sent .message-bubble{background:linear-gradient(135deg,var(--pink),var(--rose-gold));color:white;border-bottom-right-radius:6px}
        .message.received .message-bubble{background:white;color:var(--dark);border-bottom-left-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
        .message-time{font-size:10px;color:var(--gray);margin-top:4px;padding:0 4px}
        .message.sent .message-time{text-align:right}
        .message-image{max-width:100%;border-radius:12px;margin-top:8px;cursor:pointer;transition:.3s}
        .message-image:hover{transform:scale(1.02)}
        .typing-indicator{display:none;align-self:flex-start;padding:12px 20px;background:white;border-radius:20px;border-bottom-left-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
        .typing-indicator.show{display:flex}
        .typing-dots{display:flex;gap:5px;align-items:center}
        .typing-dots span{width:8px;height:8px;background:var(--pink-light);border-radius:50%;animation:typingBounce 1.4s ease-in-out infinite}
        .typing-dots span:nth-child(2){animation-delay:.2s}.typing-dots span:nth-child(3){animation-delay:.4s}
        @keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-8px);opacity:1}}
        
        /* INPUT AREA */
        .message-input-area{padding:12px 16px 20px;background:white;border-top:1px solid rgba(0,0,0,.05)}
        .input-wrapper{display:flex;align-items:flex-end;gap:10px}
        .emoji-btn,.attach-btn{width:40px;height:40px;border:none;border-radius:14px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.3s;flex-shrink:0;background:var(--light-gray)}
        .emoji-btn:hover,.attach-btn:hover{background:var(--lavender);transform:scale(1.1)}
        .message-input{flex:1;border:2px solid var(--light-gray);border-radius:20px;padding:10px 18px;font-family:'Poppins',sans-serif;font-size:14px;outline:none;transition:.3s;resize:none;max-height:100px;line-height:1.4}
        .message-input:focus{border-color:var(--pink-light);box-shadow:0 0 0 3px rgba(255,107,157,.1)}
        .send-btn{width:44px;height:44px;border:none;border-radius:16px;background:linear-gradient(135deg,var(--pink),var(--pink-dark));color:white;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.3s;flex-shrink:0}
        .send-btn:hover{transform:scale(1.1);box-shadow:0 4px 15px rgba(255,107,157,.4)}
        
        /* EMOJI PICKER */
        .emoji-picker{display:none;position:absolute;bottom:80px;left:16px;right:16px;background:white;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.15);padding:16px;z-index:200;animation:slideUp .3s ease-out}
        .emoji-picker.show{display:block}
        @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        .emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
        .emoji-item{width:100%;aspect-ratio:1;border:none;background:transparent;font-size:22px;cursor:pointer;border-radius:10px;transition:.2s;display:flex;align-items:center;justify-content:center}
        .emoji-item:hover{background:var(--light-gray);transform:scale(1.2)}
        
        /* NOTIFICATION */
        .notification{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:white;padding:12px 24px;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.15);z-index:1000;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;transition:transform .5s cubic-bezier(.68,-.55,.27,1.55);border:1px solid rgba(255,107,157,.2)}
        .notification.show{transform:translateX(-50%) translateY(0)}
        
        /* PARTICLES */
        .particle{position:absolute;pointer-events:none;animation:floatUp 3s ease-out forwards}
        @keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-200px) scale(0)}}
        
        /* RESPONSIVE */
        @media(max-width:500px){body{padding:0}.app-container{max-width:100%;height:100vh;max-height:100vh;border-radius:0}}
        
        /* Firebase Config Hidden Input */
        #firebaseConfig{display:none}
    </style>
</head>
<body>
    <!-- Firebase Config - GANTI DENGAN CONFIG ANDA -->
    <div id="firebaseConfig" data-config='{"apiKey":"YOUR_API_KEY","authDomain":"YOUR_PROJECT_ID.firebaseapp.com","projectId":"YOUR_PROJECT_ID","storageBucket":"YOUR_PROJECT_ID.appspot.com","messagingSenderId":"YOUR_SENDER_ID","appId":"YOUR_APP_ID"}'></div>

    <!-- AUTH SCREEN -->
    <div id="authScreen" class="screen active">
        <div class="auth-container">
            <div class="auth-header">
                <h1 class="app-logo">💎 GlamChat</h1>
                <p class="auth-tagline">Connect with your glamorous circle ✨</p>
            </div>
            <div id="loginForm" class="auth-form">
                <input type="email" id="loginEmail" placeholder="Email" class="auth-input">
                <input type="password" id="loginPassword" placeholder="Password" class="auth-input">
                <button class="btn-primary" onclick="handleLogin()">💖 Login</button>
                <p class="auth-switch">Belum punya akun? <a href="#" onclick="toggleAuth('register')">Daftar</a></p>
            </div>
            <div id="registerForm" class="auth-form" style="display:none">
                <input type="text" id="registerName" placeholder="Display Name" class="auth-input">
                <input type="email" id="registerEmail" placeholder="Email" class="auth-input">
                <input type="password" id="registerPassword" placeholder="Password (min. 6)" class="auth-input">
                <button class="btn-primary" onclick="handleRegister()">✨ Create Account</button>
                <p class="auth-switch">Sudah punya akun? <a href="#" onclick="toggleAuth('login')">Login</a></p>
            </div>
            <div class="auth-divider"><span>atau</span></div>
            <button class="btn-google" onclick="handleGoogleSignIn()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                Continue with Google
            </button>
        </div>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="mainScreen" class="screen">
        <div class="header">
            <div class="header-top">
                <div class="app-logo">💎 GlamChat</div>
                <div class="header-icons">
                    <div class="header-icon" onclick="openProfile()">👤</div>
                    <div class="header-icon" onclick="handleLogout()">🚪</div>
                </div>
            </div>
            <div class="stories-container">
                <div class="story add-story" onclick="showNotification('📷 Tambah Story!')">
                    <div class="story-ring"><div class="story-avatar">➕</div></div>
                    <div class="story-name">Story Kamu</div>
                </div>
                <div class="story" onclick="showNotification('👀 Bella\'s story')"><div class="story-ring"><div class="story-avatar">👩‍🦰</div></div><div class="story-name">Bella</div></div>
                <div class="story" onclick="showNotification('👀 Chelsea\'s story')"><div class="story-ring"><div class="story-avatar">👩‍🦱</div></div><div class="story-name">Chelsea</div></div>
            </div>
        </div>
        <div class="tabs">
            <div class="tab active" onclick="switchTab(this,'chats')">💬 Chats</div>
            <div class="tab" onclick="switchTab(this,'groups')">👥 Groups</div>
            <div class="tab" onclick="switchTab(this,'calls')">📞 Calls</div>
        </div>
        <div class="search-bar">
            <div class="search-input-wrapper">
                <span>🔍</span>
                <input type="text" class="search-input" placeholder="Cari teman atau chat..." oninput="searchChats(this.value)">
            </div>
        </div>
        <div class="chat-list" id="chatList"></div>
    </div>

    <!-- CHAT VIEW -->
    <div class="chat-view" id="chatView">
        <div class="chat-view-header">
            <button class="back-btn" onclick="closeChatView()">←</button>
            <div class="chat-view-avatar" id="chatViewAvatar">👩‍🦰</div>
            <div class="chat-view-info">
                <div class="chat-view-name" id="chatViewName">Bella ✅</div>
                <div class="chat-view-status" id="chatViewStatus">🟢 Online</div>
            </div>
            <div class="chat-view-actions">
                <button class="action-btn" onclick="showNotification('📹 Video call...')">📹</button>
                <button class="action-btn" onclick="showNotification('📞 Voice call...')">📞</button>
            </div>
        </div>
        <div class="messages-container" id="messagesContainer"></div>
        <div class="typing-indicator" id="typingIndicator"><div class="typing-dots"><span></span><span></span><span></span></div></div>
        <div class="emoji-picker" id="emojiPicker"><div class="emoji-grid" id="emojiGrid"></div></div>
        <div class="message-input-area">
            <div class="input-wrapper">
                <button class="emoji-btn" onclick="toggleEmojiPicker()">😊</button>
                <label class="attach-btn" style="cursor:pointer">📎<input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleImageUpload(this)"></label>
                <textarea class="message-input" id="messageInput" placeholder="Ketik pesan glamor... ✨" rows="1" oninput="autoResize(this)" onkeydown="handleKeyDown(event)"></textarea>
                <button class="send-btn" onclick="handleSendMessage()">💝</button>
            </div>
        </div>
    </div>

    <!-- NOTIFICATION -->
    <div class="notification" id="notification"></div>

    <!-- FIREBASE SDK + APP LOGIC -->
    <script type="module">
        // ===== FIREBASE IMPORTS =====
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp, where, getDocs, doc, updateDoc, arrayUnion, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

        // ===== LOAD CONFIG =====
        const configEl = document.getElementById('firebaseConfig');
        let firebaseConfig;
        try {
            firebaseConfig = JSON.parse(configEl.dataset.config);
        } catch(e) {
            console.warn('⚠️ Firebase config not set. Using demo mode.');
            firebaseConfig = null;
        }

        // ===== GLOBAL STATE =====
        let app, auth, db, storage, googleProvider;
        let currentUser = null;
        let currentChat = null;
        let messagesUnsub = null;
        const emojis = ['😊','😍','🥰','😘','💋','💖','✨','🔥','💅','👑','💎','🌸','🎀','💕','😎','🤩','🥂','🍾','💃','🕺','🎉','🎊','💐','🌹','🦋','🌺','💝','💗','🫶','😻','🤍','💜','🩷','🩵','⭐','🌟','💫','🌈','🎵','🎶','☕','🧁','🍰','🍦','🥐','🥑','🍣','🍷'];
        const demoContacts = [
            {id:1,name:"Bella 💋",avatar:"👩‍🦰",verified:true,online:true,bio:"Living my best life ✨💖",lastMessage:"OMG! Party di Bali yuk! 🎉",time:"12:30",unread:3,messages:[{text:"Haiii bestie! 💕",sent:false,time:"12:00"},{text:"Hiii! Apa kabar? 🥰",sent:true,time:"12:05"},{text:"Good! Lagi di spa nih 💅✨",sent:false,time:"12:10"}]},
            {id:2,name:"Chelsea 👑",avatar:"👩‍🦱",verified:true,online:true,bio:"Queen of everything 👑",lastMessage:"Lihat outfit aku di story! 👗",time:"11:45",unread:1,messages:[{text:"Chel! Lagi di mall",sent:false,time:"11:30"},{text:"Ooh belanja apa? 🛍️",sent:true,time:"11:35"}]},
            {id:3,name:"Giselle ✨",avatar:"👱‍♀️",verified:true,online:false,bio:"Sparkle everyday ✨",lastMessage:"Foto kita udah aku post! 📸",time:"Kemarin",unread:0,messages:[{text:"Foto kita udah aku post! 📸",sent:false,time:"18:00"}]},
        ];

        // ===== INIT FIREBASE =====
        function initFirebase() {
            if (!firebaseConfig) {
                console.log('🎭 Demo mode active - no backend');
                return false;
            }
            try {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                storage = getStorage(app);
                googleProvider = new GoogleAuthProvider();
                console.log('🔥 Firebase initialized');
                setupAuthListener();
                return true;
            } catch(e) {
                console.error('❌ Firebase init error:', e);
                return false;
            }
        }

        // ===== AUTH =====
        function setupAuthListener() {
            if (!auth) return;
            onAuthStateChanged(auth, async (user) => {
                currentUser = user;
                if (user) {
                    await syncUserData(user);
                    toggleView('main');
                    loadConversations();
                } else {
                    toggleView('auth');
                }
            });
        }

        async function syncUserData(user) {
            if (!db) return;
            const userRef = doc(db, 'users', user.uid);
            const snap = await getDocs(query(collection(db, 'users'), where('__name__', '==', user.uid)));
            if (snap.empty) {
                await setDoc(userRef, {
                    uid: user.uid, email: user.email, displayName: user.displayName || user.email.split('@')[0],
                    photoURL: user.photoURL, bio: "✨ Living my best life ✨", createdAt: serverTimestamp(),
                    lastOnline: serverTimestamp(), isOnline: true, verified: false
                });
            } else {
                await updateDoc(userRef, { lastOnline: serverTimestamp(), isOnline: true });
            }
        }

        // ===== UI FUNCTIONS =====
        window.toggleAuth = (view) => {
            document.getElementById('loginForm').style.display = view === 'login' ? 'block' : 'none';
            document.getElementById('registerForm').style.display = view === 'register' ? 'block' : 'none';
        };

        window.toggleView = (view) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(view === 'auth' ? 'authScreen' : 'mainScreen').classList.add('active');
        };

        window.showNotification = (text) => {
            const n = document.getElementById('notification');
            n.textContent = text;
            n.classList.add('show');
            setTimeout(() => n.classList.remove('show'), 2500);
        };

        window.autoResize = (el) => { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 100) + 'px'; };
        window.handleKeyDown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); window.handleSendMessage(); } };

        // ===== AUTH ACTIONS =====
        window.handleGoogleSignIn = async () => {
            if (!auth) { showNotification('🎭 Demo: Login Google tidak aktif'); return; }
            try { await signInWithPopup(auth, googleProvider); showNotification('🎉 Welcome! ✨'); }
            catch(e) { showNotification('❌ ' + (e.message || 'Login failed')); }
        };

        window.handleLogin = async () => {
            if (!auth) { showNotification('🎭 Demo: Login tidak aktif'); return; }
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;
            try { await signInWithEmailAndPassword(auth, email, pass); }
            catch(e) { showNotification('❌ ' + (e.message?.split(':')[1]?.trim() || 'Login failed')); }
        };

        window.handleRegister = async () => {
            if (!auth) { showNotification('🎭 Demo: Register tidak aktif'); return; }
            const name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const pass = document.getElementById('registerPassword').value;
            try {
                const res = await createUserWithEmailAndPassword(auth, email, pass);
                await res.user.updateProfile({ displayName: name });
                await syncUserData(res.user);
            } catch(e) { showNotification('❌ ' + (e.message?.split(':')[1]?.trim() || 'Register failed')); }
        };

        window.handleLogout = async () => {
            if (!auth) { toggleView('auth'); return; }
            try { await signOut(auth); showNotification('👋 See you! 💕'); } catch(e) {}
        };

        // ===== CHAT FUNCTIONS =====
        function renderChatList(filter = '') {
            const list = document.getElementById('chatList');
            const filtered = (firebaseConfig ? [] : demoContacts).filter(c => c.name.toLowerCase().includes(filter.toLowerCase()));
            if (!firebaseConfig && filtered.length === 0) {
                list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--gray)">💬 Mulai chat dengan teman sosialita!</div>';
                return;
            }
            list.innerHTML = filtered.map(c => `
                <div class="chat-item" onclick="openChat(${c.id})">
                    <div class="chat-avatar" style="background:linear-gradient(135deg,#fce4ec,#f8bbd0)">${c.avatar}${c.online?'<div class="online-dot"></div>':''}</div>
                    <div class="chat-info">
                        <div class="chat-name">${c.name}${c.verified?'<span>✅</span>':''}</div>
                        <div class="chat-preview">${c.lastMessage}</div>
                    </div>
                    <div class="chat-meta"><span class="chat-time">${c.time}</span>${c.unread>0?`<div class="unread-badge">${c.unread}</div>`:''}</div>
                </div>`).join('');
        }

        window.openChat = (id) => {
            currentChat = (firebaseConfig ? null : demoContacts.find(c => c.id === id));
            if (!firebaseConfig && currentChat) {
                document.getElementById('chatViewAvatar').textContent = currentChat.avatar;
                document.getElementById('chatViewName').innerHTML = `${currentChat.name}${currentChat.verified?'<span>✅</span>':''}`;
                document.getElementById('chatViewStatus').textContent = currentChat.online ? '🟢 Online' : '⚪ Last seen';
                document.getElementById('chatView').classList.add('active');
                renderMessages();
            }
        };

        window.closeChatView = () => { document.getElementById('chatView').classList.remove('active'); currentChat = null; };

        function renderMessages() {
            if (!currentChat) return;
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '<div style="text-align:center;margin:10px;color:var(--gray);font-size:12px">Today</div>';
            currentChat.messages.forEach(m => {
                const div = document.createElement('div');
                div.className = `message ${m.sent?'sent':'received'}`;
                div.innerHTML = `<div class="message-bubble">${m.text}</div><div class="message-time">${m.time}${m.sent?' ✓✓':''}</div>`;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        window.handleSendMessage = () => {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || !currentChat) return;
            
            if (firebaseConfig && auth && db && currentChat.id) {
                // Real Firebase send
                sendFirebaseMessage(text);
            } else {
                // Demo mode
                const now = new Date();
                const time = now.getHours().toString().padStart(2,':')+':'+now.getMinutes().toString().padStart(2,'0');
                currentChat.messages.push({text, sent:true, time});
                currentChat.lastMessage = text;
                currentChat.time = time;
                input.value = '';
                input.style.height = 'auto';
                renderMessages();
                renderChatList();
                createParticles();
                setTimeout(() => simulateReply(), 1500 + Math.random()*2000);
            }
        };

        async function sendFirebaseMessage(text) {
            if (!currentChat?.id || !currentUser) return;
            try {
                const msgRef = collection(db, 'conversations', currentChat.id, 'messages');
                await addDoc(msgRef, { senderId: currentUser.uid, text, timestamp: serverTimestamp(), reactions:[] });
                await updateDoc(doc(db, 'conversations', currentChat.id), { lastMessage: text, lastMessageTime: serverTimestamp() });
                document.getElementById('messageInput').value = '';
                createParticles();
            } catch(e) { showNotification('❌ Gagal kirim'); }
        }

        function simulateReply() {
            const replies = ["OMG yes bestie! 💕✨","Wah aku suka! 😍🔥","Setuju! 👑","Haha iya dong! 🥰","Absolutely! 💎🥂"];
            const now = new Date();
            const time = now.getHours().toString().padStart(2,':')+':'+now.getMinutes().toString().padStart(2,'0');
            currentChat.messages.push({text: replies[Math.floor(Math.random()*replies.length)], sent:false, time});
            currentChat.lastMessage = "Typing...";
            renderMessages();
        }

        window.handleImageUpload = async (input) => {
            const file = input.files[0];
            if (!file || !currentChat) return;
            if (firebaseConfig && storage) {
                try {
                    const storageRef = ref(storage, `chat-images/${currentUser.uid}/${Date.now()}_${file.name}`);
                    await uploadBytes(storageRef, file);
                    const url = await getDownloadURL(storageRef);
                    await sendFirebaseMessage('', url);
                } catch(e) { showNotification('❌ Upload failed'); }
            } else {
                showNotification('🎭 Demo: Upload gambar tidak aktif');
            }
            input.value = '';
        };

        // ===== EMOJI & UTILS =====
        window.toggleEmojiPicker = () => {
            const picker = document.getElementById('emojiPicker');
            picker.classList.toggle('show');
            if (picker.classList.contains('show') && !document.getElementById('emojiGrid').children.length) {
                document.getElementById('emojiGrid').innerHTML = emojis.map(e => `<button class="emoji-item" onclick="insertEmoji('${e}')">${e}</button>`).join('');
            }
        };
        window.insertEmoji = (emoji) => { const input = document.getElementById('messageInput'); input.value += emoji; input.focus(); };
        window.searchChats = (q) => renderChatList(q);
        window.switchTab = (el, tab) => { document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); el.classList.add('active'); if(tab!=='chats') showNotification(`🚧 ${tab==='groups'?'Groups':'Calls'} coming soon!`); };
        window.openProfile = () => showNotification('👤 Profile: ' + (currentUser?.displayName || 'Guest'));
        function createParticles() { const c = document.querySelector('.app-container'); for(let i=0;i<5;i++){const p=document.createElement('div');p.className='particle';p.textContent=['💖','✨','💕','🌸','💎'][Math.floor(Math.random()*5)];p.style.left=(Math.random()*80+10)+'%';p.style.bottom='80px';p.style.fontSize=(16+Math.random()*16)+'px';p.style.animationDuration=(2+Math.random()*2)+'s';c.appendChild(p);setTimeout(()=>p.remove(),4000);}}

        // ===== LOAD CONVERSATIONS (Firebase) =====
        function loadConversations() {
            if (!firebaseConfig || !db) return;
            // Implementation would subscribe to Firestore conversations collection
            renderChatList(); // Fallback to demo
        }

        // ===== INIT =====
        document.addEventListener('DOMContentLoaded', () => {
            initFirebase();
            renderChatList();
            // Setup emoji grid lazy
            document.getElementById('emojiPicker').addEventListener('mouseenter', () => {
                if (!document.getElementById('emojiGrid').children.length) {
                    document.getElementById('emojiGrid').innerHTML = emojis.map(e => `<button class="emoji-item" onclick="insertEmoji('${e}')">${e}</button>`).join('');
                }
            });
        });

        // Make functions available globally
        Object.assign(window, { toggleAuth, toggleView, showNotification, autoResize, handleKeyDown, handleGoogleSignIn, handleLogin, handleRegister, handleLogout, openChat, closeChatView, handleSendMessage, handleImageUpload, toggleEmojiPicker, insertEmoji, searchChats, switchTab, openProfile });
    </script>
</body>
</html>
